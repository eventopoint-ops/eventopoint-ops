<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="application-name" content="EVENToPOINT.ops" />
    <meta name="description" content="Real-time event operations OS. AI run-of-show, team coordination, staff check-in." />
    <meta name="theme-color" content="#0D0D0D" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- iOS ignores the web manifest for most install behavior, so these
         meta tags are what actually make "Add to Home Screen" behave like
         an app (own icon, no Safari chrome, correct title). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EVENToPOINT" />
    <title>EVENToPOINT.ops</title>
  </head>
  <body>
    <!-- Painted by the browser before a single line of JS runs, and
         replaced the moment React mounts. Without it the app shows a blank
         white screen from the tap on the icon until the first render,
         which reads as the app being slow or stuck. -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #0D0D0D;
        color: #FFFFFF;
        font-family: "Barlow Condensed", "Helvetica Neue", Arial, sans-serif;
      }
      #boot .mark {
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 26px;
      }
      #boot .bar {
        width: 92px;
        height: 2px;
        background: rgba(255, 255, 255, 0.22);
        overflow: hidden;
      }
      #boot .bar i {
        display: block;
        width: 40%;
        height: 100%;
        background: #FFFFFF;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0%   { transform: translateX(-110%); }
        100% { transform: translateX(260%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .bar i { animation: none; width: 100%; }
      }
    </style>
    <div id="boot">
      <span class="mark">EVENToPOINT.ops</span>
      <span class="bar"><i></i></span>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
